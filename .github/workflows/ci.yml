name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Linter (Ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      # Los hallazgos se muestran como anotaciones sin bloquear el CI
      - name: Ruff check
        continue-on-error: true
        run: python -m ruff check . --output-format=github

  dependency-audit:
    name: Vulnerabilidades de dependencias (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: pip-audit
        continue-on-error: true
        run: python -m pip_audit -r requirements.txt --desc

  static-analysis:
    name: Análisis estático de seguridad (Bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Bandit
        continue-on-error: true
        run: python -m bandit -c pyproject.toml -r app

  tests:
    name: Pruebas unitarias
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      # pyodbc necesita las librerías de unixODBC en Linux
      - name: Instalar unixODBC
        run: sudo apt-get update && sudo apt-get install -y unixodbc unixodbc-dev
      - name: Instalar dependencias
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: pytest
        env:
          # Los PR desde forks no reciben secretos; se usa SQLite como respaldo
          DATABASE_URL: ${{ secrets.DATABASE_URL || 'sqlite://' }}
        run: python -m pytest -q --cov-fail-under=80

  build:
    name: Build
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Instalar unixODBC
        run: sudo apt-get update && sudo apt-get install -y unixodbc unixodbc-dev
      - name: Instalar dependencias
        run: pip install -r requirements.txt
      - name: Compilar
        run: python -m compileall -q app
      - name: Verificar import de la aplicación
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || 'sqlite://' }}
        run: python -c "import app.main"

  deploy:
    name: Deploy a Azure App Service
    needs: [tests, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://comicinventory-bk.azurewebsites.net
    steps:
      - uses: actions/checkout@v4
      - name: Empaquetar
        run: zip -r release.zip app requirements.txt startup.sh
      - name: Deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: comicinventory-bk
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: release.zip
