name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      # pyodbc necesita las librerías de unixODBC en Linux
      - name: Instalar unixODBC
        run: sudo apt-get update && sudo apt-get install -y unixodbc unixodbc-dev

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Linter (Ruff)
        run: python -m ruff check .

      - name: Auditoría de dependencias (pip-audit)
        continue-on-error: true
        run: python -m pip_audit -r requirements.txt --desc

      - name: Análisis estático de seguridad (Bandit)
        continue-on-error: true
        run: python -m bandit -c pyproject.toml -r app

      - name: Pruebas unitarias
        run: python -m pytest -q --cov-fail-under=80

      - name: Build (compilación e import de la aplicación)
        env:
          DATABASE_URL: sqlite://
        run: |
          python -m compileall -q app
          python -c "import app.main"
